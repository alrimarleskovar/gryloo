  '@ethersproject/providers>ws': 8.22.0
patchedDependencies:
  '@streamparser/json@0.0.26': patches/@streamparser__json@0.0.26.patch
  '@xyflow/system@0.0.82': patches/@xyflow__system@0.0.82.patch
