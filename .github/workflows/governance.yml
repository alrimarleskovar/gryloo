          for directory,dependencies in mode_a_dependencies.items():
              manifest=strict_json(authored['packages/'+directory+'/package.json'])
              for key,value in {'name':'@defi-workflow-engine/'+directory,'version':'0.1.0','private':True,'type':'module',
                                'license':'AGPL-3.0-only','exports':linter_exports,'files':['dist','LICENSE'],'dependencies':dependencies}.items():
                  if manifest.get(key)!=value: errors.append(directory+' package contract mismatch: '+key)
          app=strict_json(authored['apps/reference-dapp/package.json'])
          for key,value in {'name':'@defi-workflow-engine/reference-dapp','version':'0.1.0','private':True,
                            'type':'module','license':'AGPL-3.0-only'}.items():
              if app.get(key)!=value: errors.append('application manifest mismatch: '+key)
          root_manifest=strict_json(authored['package.json'])
          if (root_manifest.get('private') is not True or root_manifest.get('packageManager')!='pnpm@11.22.0'
                  or root_manifest.get('license')!='Apache-2.0'
                  or root_manifest.get('engines')!={'node':'24.21.0','pnpm':'11.22.0'}):
              errors.append('workspace privacy, license, engines or packageManager mismatch')
          if authored['.node-version'].strip()!='24.21.0': errors.append('Node version declaration mismatch')
          if {v.split('/')[1] for v in current if v.startswith('packages/')}!={'workflow-contracts','action-registry','reference-linter',
                                                                            'reference-compiler','reference-executor','reference-reconciler'}:
              errors.append('unapproved or reserved package directory populated')
          if {v.split('/')[1] for v in current if v.startswith('apps/')}!={'reference-dapp'}:
              errors.append('unapproved application directory populated')
          manifest_names={'package.json','package-lock.json','npm-shrinkwrap.json','pnpm-workspace.yaml','pnpm-lock.yaml',
                          'yarn.lock','bun.lock','bun.lockb','turbo.json','Cargo.toml','Cargo.lock','pyproject.toml',
                          'requirements.txt','go.mod','go.sum','composer.json','Gemfile','Gemfile.lock'}
          approved_manifests={'package.json','pnpm-workspace.yaml','pnpm-lock.yaml','turbo.json',
                              'packages/workflow-contracts/package.json','packages/action-registry/package.json',
                              'packages/reference-linter/package.json','packages/reference-compiler/package.json',
                              'packages/reference-executor/package.json','packages/reference-reconciler/package.json',
                              'apps/reference-dapp/package.json'}
          for v in sorted(current):
              name=pathlib.PurePosixPath(v).name
              if name in manifest_names and v not in approved_manifests: errors.append('unapproved manifest: '+v)
              if re.fullmatch(r'(?i)cla(?:\.[^.]+)?',name): errors.append('CLA file: '+v)
          schema_names={'workflow-contracts':{'artifact-set','authorization-policy','evidence-bundle','execution-journal',
                                              'execution-plan','quote-state-artifact','semantic-workflow',
                                              'simulation-bundle','strategy-manifest','enforcement-matrix'},
                        'action-registry':{'action-registry'}}
          namespaces={'workflow-contracts':'contracts','action-registry':'action-registry'}
          for directory,names in schema_names.items():
              prefix='packages/'+directory+'/schemas/'
              found={v for v in current if v.startswith(prefix)}
              if found!={prefix+'v1/'+name+'.schema.json' for name in names}:
                  errors.append('schema file set changed: '+directory)
              for name in sorted(names):
                  v=prefix+'v1/'+name+'.schema.json'
                  if v not in authored: continue
                  try:
                      document=strict_json(authored[v])
                  except ValueError as exc:
                      errors.append('invalid schema JSON '+v+': '+str(exc))
                      continue
                  if (document.get('$schema')!='http://json-schema.org/draft-07/schema#'
                          or document.get('$id')!='urn:defi-workflow-engine:'+namespaces[directory]+'/v1/'+name):
                      errors.append('schema identifier mismatch: '+v)
          for v in sorted(current):
              if v.startswith('tests/compatibility/v1/') and v.endswith('.json'):
                  try:
                      strict_json(authored[v])
                  except ValueError as exc:
                      errors.append('invalid compatibility fixture JSON '+v+': '+str(exc))

          # Workflow and output hygiene.
          workflows={v for v in current if v.startswith('.github/')}
          if workflows!={'.github/workflows/governance.yml','.github/workflows/contracts.yml'}:
              errors.append('unexpected .github path set: '+repr(sorted(workflows)))
          # Built from parts so this check does not match its own source.
          expression='$'+'{{'
          privileged='pull_request'+'_target'
          for v in sorted(workflows):
              body=authored[v]
              if '\npermissions:\n  contents: read\n' not in body: errors.append('workflow lacks read-only permissions: '+v)
              if re.search(r'(?m)^\s+[a-z-]+:\s*write\b',body): errors.append('workflow requests write permission: '+v)
              if privileged in body or expression+' secrets.' in body:
                  errors.append('workflow uses privileged trigger or repository secrets: '+v)
          generated=re.compile(r'(?:^|/)(?:node_modules|dist|\.next|\.turbo|test-results|playwright-report|coverage|__pycache__)/'
                               r'|\.tsbuildinfo$|\.log$|\.pyc$|(?:^|/)\.env(?:\.|$)|\.cdx\.json$|(?:^|/)\.DS_Store$')
          for v in sorted(current):
              if generated.search(v): errors.append('generated output or local artifact present: '+v)
          ignored=set(authored['.gitignore'].splitlines())
          for pattern in ('node_modules/','.next','dist','.turbo/','*.tsbuildinfo','.env','apps/reference-dapp/test-results/'):
              if pattern not in ignored: errors.append('.gitignore no longer ignores: '+pattern)
          for name in ('LICENSE-APACHE-2.0','docs/MASTER_SPEC_V3.2.md'):
              if (root/name).exists(): errors.append('forbidden file: '+name)
          check=subprocess.run(['git','diff','--check',amendment_baseline,'--'],capture_output=True,text=True)
          if check.returncode!=0:
              errors.append('whitespace errors since '+amendment_baseline+':\n'+check.stdout.strip())
          since=set(subprocess.check_output(['git','diff','--name-only',amendment_baseline,'--'],text=True).splitlines())
          since|=paths('ls-files','--others','--exclude-standard')
          for v in sorted(since):
              if v in authored and ('\r' in authored[v] or not authored[v].endswith('\n')):
                  errors.append('changed text file needs LF endings and a final newline: '+v)

          if errors:
              print('\n'.join(errors),file=sys.stderr)
              raise SystemExit(1)
          print('Restored governance controls passed: %d text files scanned for secret indicators, '
                '%d Gryloo-authored files scanned for email, brand and claim rules, %d Markdown files link-checked, '
                '%d protected digests, %d decision IDs and %d requirement IDs'
                % (len(texts),len(authored),len(markdown),len(protected),len(registered['decision']),
                   len(registered['requirement'])))
          PYCODE
