                      or sentence not in new_cells[3]
                      or old_cells[3].split(sentence)[0]!=new_cells[3].split(sentence)[0]):
                  errors.append('license map classification, path or grant text changed')
          if 'explicitly approved tracked governance or licensing amendment' not in '\n'.join(new_map):
