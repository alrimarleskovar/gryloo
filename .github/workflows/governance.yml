name: Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch reviewed revision, BUILD-002 baseline and BUILD-002 merge
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$SERVER/$REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin fb285da4ea4efaaae5b839974b669b3c8335ddd7
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin 606174f0bd944e5a1c31baf8dad685d7558b7cc8
          unset auth GH_TOKEN

