name: Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch reviewed revision and BUILD-002 baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote add origin "$SERVER/$REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin fb285da4ea4efaaae5b839974b669b3c8335ddd7
          unset auth GH_TOKEN

      - name: Verify exact scope, protected bytes and licensing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib, pathlib, re, subprocess, sys
          root=pathlib.Path('.')
          baseline='fb285da4ea4efaaae5b839974b669b3c8335ddd7'
          create=set(['THIRD_PARTY_NOTICES.md', 'apps/reference-dapp/LICENSE', 'apps/reference-dapp/e2e/build-roundtrip.spec.ts', 'apps/reference-dapp/e2e/fixtures.ts', 'apps/reference-dapp/e2e/interface-honesty.spec.ts', 'apps/reference-dapp/e2e/network-isolation.spec.ts', 'apps/reference-dapp/e2e/visual-shell.spec.ts', 'apps/reference-dapp/e2e/visual-shell.spec.ts-snapshots/build-chromium-linux.png', 'apps/reference-dapp/e2e/visual-shell.spec.ts-snapshots/execute-chromium-linux.png', 'apps/reference-dapp/e2e/visual-shell.spec.ts-snapshots/simulate-chromium-linux.png', 'apps/reference-dapp/next-env.d.ts', 'apps/reference-dapp/next.config.ts', 'apps/reference-dapp/package.json', 'apps/reference-dapp/playwright.config.ts', 'apps/reference-dapp/src/app/globals.css', 'apps/reference-dapp/src/app/layout.tsx', 'apps/reference-dapp/src/app/page.tsx', 'apps/reference-dapp/src/components/action-library.tsx', 'apps/reference-dapp/src/components/app-shell.tsx', 'apps/reference-dapp/src/components/artifact-inspector.tsx', 'apps/reference-dapp/src/components/copilot-panel.tsx', 'apps/reference-dapp/src/components/status-badge.tsx', 'apps/reference-dapp/src/components/summary-bar.tsx', 'apps/reference-dapp/src/components/top-bar.tsx', 'apps/reference-dapp/src/components/workflow-canvas.tsx', 'apps/reference-dapp/src/config/product.test.ts', 'apps/reference-dapp/src/config/product.ts', 'apps/reference-dapp/src/domain/commands.test.ts', 'apps/reference-dapp/src/domain/commands.ts', 'apps/reference-dapp/src/domain/contracts.integration.test.ts', 'apps/reference-dapp/src/domain/editor.test.ts', 'apps/reference-dapp/src/domain/editor.ts', 'apps/reference-dapp/src/domain/initial-workflow.ts', 'apps/reference-dapp/src/domain/mock-actions.ts', 'apps/reference-dapp/src/state/workflow-store.tsx', 'apps/reference-dapp/tsconfig.json', 'docs/builds/BUILD-002-PLAN.md', 'docs/builds/BUILD-002-REPORT.md', 'patches/@xyflow__system@0.0.82.patch', 'scripts/bootstrap-playwright.py', 'third_party/licenses/caniuse-lite-1.0.30001810-LICENSE', 'third_party/licenses/img-sharp-libvips-darwin-arm64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-darwin-x64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linux-arm-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linux-arm64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linux-ppc64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linux-riscv64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linux-s390x-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linux-x64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linuxmusl-arm64-1.3.3-README.md', 'third_party/licenses/img-sharp-libvips-linuxmusl-x64-1.3.3-README.md', 'third_party/licenses/img-sharp-wasm32-0.35.4-LICENSE', 'third_party/licenses/img-sharp-wasm32-0.35.4-README.md', 'third_party/licenses/img-sharp-win32-0.35.4-LICENSE', 'third_party/licenses/img-sharp-win32-arm64-0.35.4-README.md', 'third_party/licenses/img-sharp-win32-ia32-0.35.4-README.md', 'third_party/licenses/img-sharp-win32-x64-0.35.4-README.md', 'third_party/licenses/tslib-2.8.1-CopyrightNotice.txt', 'third_party/licenses/tslib-2.8.1-LICENSE.txt', 'third_party/licenses/xyflow-system-MIT.txt'])
          modify=set(['.github/workflows/contracts.yml', '.github/workflows/governance.yml', '.gitignore', 'README.md', 'docs/AUTHORITY_MATRIX.md', 'docs/DECISIONS.md', 'docs/EVIDENCE_LEVELS.md', 'docs/LICENSE_MAP.md', 'docs/NEXT_BUILD.md', 'docs/REQUIREMENTS.md', 'docs/SCOPE_GUARD.md', 'docs/SECURITY_MODEL.md', 'docs/STATUS.md', 'eslint.config.mjs', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'scripts/bootstrap-ci.py', 'turbo.json'])
          notice_hashes={'third_party/licenses/caniuse-lite-1.0.30001810-LICENSE': 'fd3a263fe19ed8faa9068b43abaebafc02c77897b0c6fc09abc04bb592e5f16e', 'third_party/licenses/img-sharp-libvips-darwin-arm64-1.3.3-README.md': '47083f1ae7e990f74a56f576bcb8434051cb84ed1982fa57932720869e5147fe', 'third_party/licenses/img-sharp-libvips-darwin-x64-1.3.3-README.md': 'bbb84e1fa86b44508e893afe1a84a640cd452c0e671f001256959352bfacb7e5', 'third_party/licenses/img-sharp-libvips-linux-arm-1.3.3-README.md': '8562d3e04aa8abf13264a8a27152cc5e9da7269984961871008cab475e0f2e63', 'third_party/licenses/img-sharp-libvips-linux-arm64-1.3.3-README.md': 'b05efaa208519f349746a54ee195c433ab8e5c250847a257c984c7a9dc68df20', 'third_party/licenses/img-sharp-libvips-linux-ppc64-1.3.3-README.md': '6cf3175d5bf6b5335de0b062b1c000809c273a88e093e8c3a41d690b4a0f639e', 'third_party/licenses/img-sharp-libvips-linux-riscv64-1.3.3-README.md': '913086c8cc5ff42f3394bdc8b45fb574ce75c3fb8cb8f4e5817338f751935b92', 'third_party/licenses/img-sharp-libvips-linux-s390x-1.3.3-README.md': '978760ba002481940b97aeb87450c96cbb985d3607dbc30a4b3ad5cf0e1c484e', 'third_party/licenses/img-sharp-libvips-linux-x64-1.3.3-README.md': '4f87b4934d26d52ed65a42e96bfe88e75ac98dbd3bc302b50fe6c07d22e42630', 'third_party/licenses/img-sharp-libvips-linuxmusl-arm64-1.3.3-README.md': '1a42557691426812906e98442b6575bd3fd509a3a0ea53d28e9ce52c2ccbb243', 'third_party/licenses/img-sharp-libvips-linuxmusl-x64-1.3.3-README.md': '2948195d2a4f5bb3c9cdc22ac4184e38b63c8319c2753d454571cf7b31482b17', 'third_party/licenses/img-sharp-wasm32-0.35.4-LICENSE': '73ba74dfaa520b49a401b5d21459a8523a146f3b7518a833eea5efa85130bf68', 'third_party/licenses/img-sharp-wasm32-0.35.4-README.md': '9d7a84ade91e8e50f5dfc303fb53e580e806f6f89bde804e84a01c1b8853fff5', 'third_party/licenses/img-sharp-win32-0.35.4-LICENSE': 'dc1f5d2d43c5531dfe0acaf4e950ea5dbe3e61e1850cf0e983bda7efc10d6693', 'third_party/licenses/img-sharp-win32-arm64-0.35.4-README.md': '274c9c3ce77170a73f9974cbb4e6ca617271219f48b34b8c1df213538ab2ffa0', 'third_party/licenses/img-sharp-win32-ia32-0.35.4-README.md': 'a0055c3ae7d1d8d409b0e9c21f008914adcf7adf8d85bf4186e416033d5192d1', 'third_party/licenses/img-sharp-win32-x64-0.35.4-README.md': '280e7d164420cfc1a1b192a582bf53e3dba97b86a5c3575f878b674ad1d41e13', 'third_party/licenses/tslib-2.8.1-CopyrightNotice.txt': 'da16ddb65f8ca390998fb99223d0112498b56b45784d00afd77ff8ce1ac4de8b', 'third_party/licenses/tslib-2.8.1-LICENSE.txt': '210b19e543130388c68654b7497e967119ce17145f66ab7d85688fbd70f08751', 'third_party/licenses/xyflow-system-MIT.txt': '023119ac20fb1c8c9930abe0bcd196989a1960388529a96fc43cebf96f07c9ff'}
          errors=[]
          def paths(*args):
              return {v.decode() for v in subprocess.check_output(['git',*args,'-z']).split(b'\0') if v}
          before=paths('ls-tree','-r','--name-only',baseline)
          now=paths('ls-files') | paths('ls-files','--others','--exclude-standard')
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'--'],text=True).splitlines())
          if now-before!=create:
              errors.append('created path mismatch: '+repr(sorted((now-before)^create)))
          errors += ['unauthorized modified path: '+v for v in sorted(changed-create-modify)]
          for v in sorted(before):
              file=root/v
              if not file.is_file():
                  errors.append('baseline file missing: '+v)
              elif v not in modify and file.read_bytes()!=subprocess.check_output(['git','show',baseline+':'+v]):
                  errors.append('protected baseline changed: '+v)
          for v in sorted(now):
              if (root/v).is_symlink(): errors.append('symlink: '+v)
              if v.startswith(('managed/','private/','proprietary/','services/managed/','services/partner-gateway/','services/enterprise-policy/','services/hosted-explorer/')):
                  errors.append('private plane path: '+v)
              if 'sbom' in v.lower(): errors.append('retained SBOM: '+v)
              if v.startswith('.github/workflows/') and re.search(r'(?m)^\s*(?:-\s*)?uses\s*:',(root/v).read_text()):
                  errors.append('external GitHub Action: '+v)
          if (root/'apps/reference-dapp/LICENSE').read_bytes()!=(root/'LICENSES/AGPL-3.0-only.txt').read_bytes():
              errors.append('application AGPL text mismatch')
          patch=root/'patches/@xyflow__system@0.0.82.patch'
          if hashlib.sha256(patch.read_bytes()).hexdigest()!='4420c4eab49ef56325c7cb81898894b1c9f08fe39621216e8cf77532ce98f6d5':
              errors.append('XYFlow patch hash mismatch')
          patch_files=re.findall(r'(?m)^diff --git a/(\S+) b/(\S+)$',patch.read_text())
          if len(patch_files)!=2 or {a for a,b in patch_files}!={'dist/esm/types/nodes.d.ts','dist/umd/types/nodes.d.ts'} or any(a!=b for a,b in patch_files):
              errors.append('XYFlow declaration-only patch scope changed')
          for v,digest in notice_hashes.items():
              if hashlib.sha256((root/v).read_bytes()).hexdigest()!=digest:
                  errors.append('upstream legal material hash mismatch: '+v)
          notice=(root/'THIRD_PARTY_NOTICES.md').read_text()
          for v,digest in notice_hashes.items():
              if 'xyflow-system' not in v and (pathlib.Path(v).name not in notice or digest not in notice):
                  errors.append('third-party notice mapping missing: '+v)
          lic=(root/'docs/LICENSE_MAP.md').read_text()
          for marker in ('apps/reference-dapp/**','AGPL-3.0-only','THIRD_PARTY_NOTICES.md','LGPL-3.0-or-later','CC-BY-4.0','0BSD','replacement/relink'):
              if marker not in lic: errors.append('license map missing: '+marker)
          if 'PROPOSED' not in (root/'docs/adr/ADR-0001-mode-b-authority.md').read_text():
              errors.append('ADR-0001 changed status')
          for v in ('docs/STATUS.md','docs/NEXT_BUILD.md','docs/builds/BUILD-002-PLAN.md','docs/builds/BUILD-002-REPORT.md'):
              if 'BUILD-002' not in (root/v).read_text(): errors.append('missing BUILD-002 authority: '+v)
          for file in (root/'apps/reference-dapp/src').rglob('*'):
              if file.suffix in ('.ts','.tsx','.css') and re.search(r'https?://|wss?://|@import\s+url',file.read_text()):
                  errors.append('remote application URL: '+str(file))
          # Exact path scope makes this exhaustive over the reviewed tree.
          for v in sorted(now):
              classes=[]
              if v=='LICENSE': classes.append('routing')
              if v.startswith('docs/assets/'): classes.append('excluded')
              if v in ('LICENSES/Apache-2.0.txt','LICENSES/AGPL-3.0-only.txt',
                       'packages/workflow-contracts/LICENSE',
                       'packages/action-registry/LICENSE',
                       'apps/reference-dapp/LICENSE'): classes.append('official text')
              if v.startswith('third_party/licenses/'): classes.append('upstream legal text')
              if v.startswith('patches/'): classes.append('upstream patch')
              if v.startswith('apps/reference-dapp/') and v!='apps/reference-dapp/LICENSE':
                  classes.append('AGPL-3.0-only')
              if not classes: classes.append('Apache-2.0')
              if len(classes)!=1: errors.append('ambiguous classification: '+v)
          if errors:
              print('\n'.join(errors),file=sys.stderr)
              raise SystemExit(1)
          print('BUILD-002 exact scope, protected baseline and legal hashes passed')
          PYCODE
