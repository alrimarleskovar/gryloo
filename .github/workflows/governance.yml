name: Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: [self-hosted, flofi-wsl]
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch current revision and immediate parents for whitespace diff
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$SERVER/$REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --depth=2 origin "$REVISION"
          git checkout --detach -f FETCH_HEAD
          git clean -ffdx
          unset auth GH_TOKEN

      - name: Governance-lite self-tests and safety check
        env:
          GOVERNANCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GOVERNANCE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_governance_lite.py'
          python3 scripts/governance_lite.py
          git diff --check
          git diff --check HEAD^1 HEAD
